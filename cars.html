<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bey City — Mercedes collection</title><style>*{box-sizing:border-box}body{margin:0;background:#151c21;color:#eee;font:14px system-ui}header{padding:24px 32px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px}a{color:#efc37e}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 28px 28px}.car{height:210px;position:relative;border:1px solid #465057;border-radius:6px;overflow:hidden;background:#222c32}.car h2{position:absolute;bottom:12px;left:16px;font-size:13px;margin:0;z-index:2}.view{height:175px}canvas{position:fixed;inset:0;pointer-events:none}@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><div><h1>The Mercedes collection</h1><p>Eleven cars. Every one drivable in Bey City.</p></div><a href="/">Back to the city ↗</a></header><main id="cars"></main><canvas id="showroom"></canvas><script type="module">
import * as THREE from 'three';import {prepareVehicleMaterials} from './src/game/vehicle-materials.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {addVehicleWheels} from './src/game/vehicle-wheels.js';
const assets=await(await fetch('/assets/game/models.json')).json(),renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,alpha:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.setScissorTest(true);const views=[],loader=new GLTFLoader();
for(const asset of assets.cars){const card=document.createElement('section');card.className='car';card.innerHTML=`<div class="view"></div><h2>${asset.name}</h2>`;document.querySelector('main').append(card);const scene=new THREE.Scene();const gltf=await loader.loadAsync(asset.url);prepareVehicleMaterials(gltf.scene,asset,views.length);const group=new THREE.Group();group.add(gltf.scene);scene.add(group);addVehicleWheels(gltf.scene,group,asset);scene.add(new THREE.HemisphereLight('#daeaff','#586570',2.6));const light=new THREE.DirectionalLight('#ffe7c9',3);light.position.set(3,6,4);scene.add(light);const floor=new THREE.Mesh(new THREE.CircleGeometry(5,48),new THREE.MeshStandardMaterial({color:'#303e47',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.035;scene.add(floor);const camera=new THREE.PerspectiveCamera(35,1,.1,100);const length=asset.dimensions.z;camera.position.set(length*.9,length*.62,-length*1.05);camera.lookAt(0,asset.dimensions.y*.45,0);views.push({scene,camera,element:card.querySelector('.view')});}
function draw(){renderer.setSize(innerWidth,innerHeight,false);for(const v of views){const r=v.element.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;const bottom=innerHeight-r.bottom;renderer.setViewport(r.left,bottom,r.width,r.height);renderer.setScissor(r.left,bottom,r.width,r.height);v.camera.aspect=r.width/r.height;v.camera.updateProjectionMatrix();renderer.render(v.scene,v.camera);}requestAnimationFrame(draw);}draw();
</script></body></html>
